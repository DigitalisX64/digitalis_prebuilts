name: Build Digitalis Prebuilts
description: Trigger a GitHub Actions prebuilt build for an AOSP release branch or custom translator branch (maintainers only)
title: "[Build] "
labels: ["build"]
body:
  - type: markdown
    attributes:
      value: |
        Opening this issue triggers **Build Digitalis Prebuilts** automatically when submitted by a repository owner, member, or collaborator.
        The issue closes automatically once the build (and release, if enabled) succeeds.
        You can control builds via comments on this issue: `/build`, `/rebuild`, `/release`, `/cancel`, `/status`, or `/help`.

  - type: dropdown
    id: target_aosp
    attributes:
      label: Target AOSP
      description: Which AOSP release branch(es) to build prebuilts for.
      options:
        - android17
        - android16
        - all
      default: 0
    validations:
      required: true

  - type: input
    id: bt_ref
    attributes:
      label: Translator branch or commit (optional)
      description: >-
        Branch, tag, or commit SHA in DigitalisX64/platform_frameworks_libs_binary_translation.
        Leave blank to build the latest HEAD of each target AOSP branch.
        When Target AOSP is "all", this field MUST be left blank (each AOSP target then builds
        from its own branch HEAD, i.e. android17 and android16); passing a custom ref with "all"
        is rejected because one translator ref cannot build both AOSP 16 and AOSP 17.
      placeholder: android17

  - type: checkboxes
    id: publish_release
    attributes:
      label: Publish GitHub Release
      options:
        - label: Publish a GitHub Release with the built tarballs

  - type: input
    id: release_tag
    attributes:
      label: Release tag (optional)
      description: >-
        Custom tag for a single-branch release. Ignored when Target AOSP is "all"
        (because "all" publishes one separate GitHub Release per branch using
        <branch>-<YYYY-MM-DD>-<bt_sha>). Leave blank for the default per-branch tag
        (e.g. android17-2026-11-22-5d66dd11).
      placeholder: android17-2026-11-22-5d66dd11

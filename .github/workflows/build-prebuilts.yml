name: Build Digitalis Prebuilts

run-name: >-
  ${{ github.event.issue.number && format('Build prebuilts (issue #{0})', github.event.issue.number) || format('Build prebuilts ({0})', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      aosp:
        description: "AOSP target to build"
        type: choice
        default: "all"
        options:
          - all
          - android17
          - android16
      bt_ref:
        description: "Optional branch, tag, or SHA in platform_frameworks_libs_binary_translation (empty = pinned in config/versions.json; must be empty when aosp is 'all')"
        type: string
        required: false
        default: ""
      use_branch_head:
        description: "Build latest HEAD of the target AOSP branch on GitHub instead of the lockfile SHA"
        type: boolean
        default: false
      publish_release:
        description: "Publish a GitHub Release with the packaged tarballs"
        type: boolean
        default: false
      release_tag:
        description: "Optional custom release tag (single AOSP target only; ignored when aosp is 'all', which uses <branch>-<YYYY-MM-DD>-<bt_sha> per branch)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Plan build matrix
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.type != 'Bot' &&
       (contains(github.event.comment.body, '/build') ||
        contains(github.event.comment.body, '/rebuild') ||
        contains(github.event.comment.body, '/release')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      aosp_matrix: ${{ steps.plan.outputs.aosp_matrix }}
      build_date: ${{ steps.plan.outputs.build_date }}
      bt_ref: ${{ steps.plan.outputs.bt_ref }}
      digitalis_ref: ${{ steps.plan.outputs.digitalis_ref }}
      use_branch_head: ${{ steps.plan.outputs.use_branch_head }}
      should_release: ${{ steps.plan.outputs.should_release }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      issue_number: ${{ steps.plan.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate lockfile and resolve trigger parameters
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AOSP: ${{ inputs.aosp }}
          INPUT_BT_REF: ${{ inputs.bt_ref }}
          INPUT_USE_HEAD: ${{ inputs.use_branch_head }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
          INPUT_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/lock.py check
          all_versions="$(python3 scripts/lock.py versions)"
          build_date="$(date -u +%Y-%m-%d)"

          should_build="true"
          matrix="[]"
          bt_ref=""
          digitalis_ref=""
          use_branch_head="false"
          should_release="false"
          release_tag=""
          issue_number=""

          if [[ "$EVENT_NAME" == "issues" || "$EVENT_NAME" == "issue_comment" ]]; then
            parsed="$(python3 scripts/parse_issue_trigger.py \
              --event-name "$EVENT_NAME" \
              --event-path "$GITHUB_EVENT_PATH")"
            echo "parsed issue trigger: $parsed"
            should_build="$(jq -r .should_build <<<"$parsed")"
            issue_number="$(jq -r '.issue_number // ""' <<<"$parsed")"
            if [[ "$should_build" == "true" ]]; then
              matrix="$(jq -c .versions <<<"$parsed")"
              bt_ref="$(jq -r .bt_ref <<<"$parsed")"
              digitalis_ref="$(jq -r .digitalis_ref <<<"$parsed")"
              use_branch_head="$(jq -r .use_branch_head <<<"$parsed")"
              should_release="$(jq -r .publish_release <<<"$parsed")"
              release_tag="$(jq -r .release_tag <<<"$parsed")"
              run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              ref_note="${bt_ref:-branch HEAD (latest)}"
              if [[ "$use_branch_head" != "true" && -z "$bt_ref" ]]; then
                ref_note="pinned in config/versions.json"
              fi
              targets_csv="$(jq -r 'join(", ")' <<<"$matrix")"
              rel_suffix=""
              if [[ "$should_release" == "true" ]]; then
                if [[ -n "$release_tag" && "$(jq 'length' <<<"$matrix")" -eq 1 ]]; then
                  rel_suffix=" (\`${release_tag}\`)"
                else
                  rel_suffix=" (\`<branch>-${build_date}-<sha>\` per branch)"
                fi
              fi
              gh issue comment "$issue_number" --body-file - <<EOF
          Triggered prebuilt build from this issue:
          - **Targets:** \`${targets_csv}\`
          - **Translator ref:** \`${ref_note}\`
          - **Publish release:** \`${should_release}\`${rel_suffix}
          - **Workflow run:** ${run_url}
          - **Commands:** comment \`/cancel\` to stop this build, or \`/status\` to check runs.
          EOF
            else
              echo "skipping build: $(jq -r .reason <<<"$parsed")"
            fi
          else
            if [[ -n "$INPUT_AOSP" && "$INPUT_AOSP" != "all" ]]; then
              echo "$all_versions" | jq -e --arg v "$INPUT_AOSP" 'index($v) != null' >/dev/null \
                || { echo "::error::version $INPUT_AOSP not in config/versions.json"; exit 1; }
              matrix="$(jq -cn --arg v "$INPUT_AOSP" '[$v]')"
            else
              matrix="$all_versions"
            fi
            bt_ref="${INPUT_BT_REF:-}"
            if [[ -n "$bt_ref" && "$(jq 'length' <<<"$matrix")" -gt 1 ]]; then
              echo "::error::custom translator ref '$bt_ref' cannot be applied when targeting all AOSP versions; select a single AOSP target or leave bt_ref blank"
              exit 1
            fi
            use_branch_head="${INPUT_USE_HEAD:-false}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              should_release="true"
              release_tag=""
            elif [[ "$INPUT_PUBLISH" == "true" ]]; then
              should_release="true"
              if [[ "$(jq 'length' <<<"$matrix")" -eq 1 ]]; then
                release_tag="${INPUT_TAG:-}"
              else
                release_tag=""
              fi
            fi
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "aosp_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          echo "bt_ref=$bt_ref" >> "$GITHUB_OUTPUT"
          echo "digitalis_ref=$digitalis_ref" >> "$GITHUB_OUTPUT"
          echo "use_branch_head=$use_branch_head" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.aosp }})
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
    concurrency:
      group: build-prebuilts-${{ matrix.aosp }}-${{ needs.plan.outputs.issue_number || github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        aosp: ${{ fromJSON(needs.plan.outputs.aosp_matrix) }}
    env:
      AOSP_BRANCH: ${{ matrix.aosp }}
      BUILD_DATE: ${{ needs.plan.outputs.build_date }}
      BT_REF: ${{ needs.plan.outputs.bt_ref }}
      DIGITALIS_REF: ${{ needs.plan.outputs.digitalis_ref }}
      USE_BRANCH_HEAD: ${{ needs.plan.outputs.use_branch_head }}
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk and add swap
        run: scripts/free-runner-disk.sh "digitalis-${AOSP_BRANCH}"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            binutils e2fsprogs erofs-utils jq

      - name: Fetch pinned AOSP framework and unproxied guest libraries
        run: |
          python3 scripts/fetch_aosp_libs.py \
            --android "$AOSP_BRANCH" \
            --framework-out "$DIGITALIS_WORK/framework-libs" \
            --guest-out "$DIGITALIS_WORK/guest-libs" \
            --work-dir "$DIGITALIS_WORK"
          ls -lh "$DIGITALIS_WORK/framework-libs" "$DIGITALIS_WORK/guest-libs"

      - name: Fetch reduced AOSP and Digitalis source tree
        run: |
          start=$SECONDS
          extra_args=()
          if [[ -n "$BT_REF" ]]; then
            extra_args+=(--bt-ref "$BT_REF")
          fi
          if [[ -n "$DIGITALIS_REF" ]]; then
            extra_args+=(--digitalis-ref "$DIGITALIS_REF")
          fi
          if [[ "$USE_BRANCH_HEAD" == "true" ]]; then
            extra_args+=(--use-branch-head)
          fi
          python3 scripts/fetch_source.py \
            --android "$AOSP_BRANCH" \
            --top "$DIGITALIS_WORK/aosp" \
            --jobs 8 \
            "${extra_args[@]}"
          echo "fetched in $(( (SECONDS - start) / 60 ))m $(( (SECONDS - start) % 60 ))s"
          du -sh "$DIGITALIS_WORK/aosp"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Build translator prebuilts and host tests
        timeout-minutes: 290
        run: |
          start=$SECONDS
          scripts/build.sh "$DIGITALIS_WORK/aosp" "$DIGITALIS_WORK/framework-libs"
          echo "built in $(( (SECONDS - start) / 60 ))m $(( (SECONDS - start) % 60 ))s"
          du -sh "$DIGITALIS_WORK/aosp/out"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Package canonical Digitalis prebuilt bundle
        id: pkg
        run: |
          python3 scripts/package_bundle.py package \
            --config-mk "$DIGITALIS_WORK/aosp/frameworks/libs/binary_translation/berberis_config.mk" \
            --product-out "$DIGITALIS_WORK/aosp/out/target/product/digitalis_prebuilts" \
            --guest-libs "$DIGITALIS_WORK/guest-libs" \
            --out "$DIGITALIS_WORK/dist" \
            --android "$AOSP_BRANCH" \
            --date "$BUILD_DATE" \
            --username "digitalis-ci" \
            --sources "$DIGITALIS_WORK/aosp/.digitalis-sources.json" \
            --license "$DIGITALIS_WORK/aosp/digitalis/LICENSE" \
            --bt-ref "$BT_REF"
          cp "$DIGITALIS_WORK/dist/digitalis-prebuilts/MANIFEST.txt" \
             "$DIGITALIS_WORK/dist/digitalis-prebuilts/SOURCES.json" \
             "$DIGITALIS_WORK/dist/"
          ls -lh "$DIGITALIS_WORK/dist"
          cat "$DIGITALIS_WORK/dist/MANIFEST.txt"
          release_id="$(awk -F': *' '/^release-id:/{print $2}' "$DIGITALIS_WORK/dist/MANIFEST.txt")"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Verify packaged bundle
        run: |
          tarballs=("$DIGITALIS_WORK"/dist/digitalis-prebuilts-*.tar.gz)
          python3 scripts/verify_bundle.py "${tarballs[0]}" \
            --config-mk "$DIGITALIS_WORK/aosp/frameworks/libs/binary_translation/berberis_config.mk" \
            --top "$DIGITALIS_WORK/aosp"
          if [[ -x "$DIGITALIS_WORK/aosp/digitalis/scripts/verify-digitalis-prebuilts.sh" ]]; then
            ANDROID_BUILD_TOP="$DIGITALIS_WORK/aosp" \
              "$DIGITALIS_WORK/aosp/digitalis/scripts/verify-digitalis-prebuilts.sh" \
              "$DIGITALIS_WORK/dist/digitalis-prebuilts"
          fi

      - name: Run host tests
        run: scripts/run-host-tests.sh "$DIGITALIS_WORK/aosp" "$DIGITALIS_WORK/reports"

      - name: Upload prebuilt bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: digitalis-prebuilts-${{ steps.pkg.outputs.release_id }}
          path: |
            ${{ env.DIGITALIS_WORK }}/dist/digitalis-prebuilts-*.tar.gz
            ${{ env.DIGITALIS_WORK }}/dist/digitalis-prebuilts-*.tar.gz.sha256
            ${{ env.DIGITALIS_WORK }}/dist/MANIFEST.txt
            ${{ env.DIGITALIS_WORK }}/dist/SOURCES.json
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.should_release == 'true' && 1 || 7 }}

      - name: Upload build logs and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.aosp }}
          path: |
            ${{ env.DIGITALIS_WORK }}/aosp/out/error.log
            ${{ env.DIGITALIS_WORK }}/aosp/out/soong.log
            ${{ env.DIGITALIS_WORK }}/aosp/out/missing-inputs.txt
            ${{ env.DIGITALIS_WORK }}/aosp/.digitalis-targets
            ${{ env.DIGITALIS_WORK }}/aosp/.digitalis-sources.json
            ${{ env.DIGITALIS_WORK }}/reports/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3

  release:
    name: Publish GitHub Releases (one per branch)
    needs: [plan, build]
    if: needs.plan.outputs.should_build == 'true' && needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_urls: ${{ steps.publish.outputs.release_urls }}
    env:
      GH_TOKEN: ${{ github.token }}
      CUSTOM_TAG: ${{ needs.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Download prebuilt artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: digitalis-prebuilts-*
          path: release-artifacts

      - name: Verify checksums and publish one GitHub Release per branch
        id: publish
        run: |
          shopt -s nullglob
          dirs=()
          for m in release-artifacts/MANIFEST.txt release-artifacts/*/MANIFEST.txt; do
            dirs+=("$(dirname "$m")")
          done
          if (( ${#dirs[@]} == 0 )); then
            echo "::error::no prebuilt artifacts found to release"
            exit 1
          fi

          release_urls=()
          for dir in "${dirs[@]}"; do
            [[ -d "$dir" ]] || continue
            (
              cd "$dir"
              sha256sum -c -- *.tar.gz.sha256
            )
            release_id="$(awk -F': *' '/^release-id:/{print $2}' "$dir/MANIFEST.txt")"
            tar_files=("$dir"/*.tar.gz)
            tar_name="$(basename "${tar_files[0]}")"

            tag="$release_id"
            if [[ -n "$CUSTOM_TAG" && ${#dirs[@]} -eq 1 ]]; then
              tag="$CUSTOM_TAG"
            fi

            notes_file="${dir}/release-notes.md"
            python3 scripts/generate_release_notes.py \
              --tag "$tag" \
              --tarball-name "$tar_name" \
              --manifest "$dir/MANIFEST.txt" \
              --sources "$dir/SOURCES.json" \
              --repo "$GITHUB_REPOSITORY" \
              --output "$notes_file"
            cat "$notes_file"

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" \
                "$dir"/*.tar.gz "$dir"/*.tar.gz.sha256 "$dir/MANIFEST.txt" "$dir/SOURCES.json" \
                --clobber
              gh release edit "$tag" --notes-file "$notes_file"
            else
              gh release create "$tag" \
                "$dir"/*.tar.gz "$dir"/*.tar.gz.sha256 "$dir/MANIFEST.txt" "$dir/SOURCES.json" \
                --title "Digitalis Prebuilts ${tag}" \
                --notes-file "$notes_file"
            fi
            release_urls+=("${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}")
          done

          printf 'release_urls=%s\n' "$(IFS=,; echo "${release_urls[*]}")" >> "$GITHUB_OUTPUT"

  notify-issue:
    name: Report status to triggering issue
    needs: [plan, build, release]
    if: always() && needs.plan.outputs.should_build == 'true' && needs.plan.outputs.issue_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.plan.outputs.issue_number }}
      IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
      BUILD_RESULT: ${{ needs.build.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
      RELEASE_URLS: ${{ needs.release.outputs.release_urls }}
    steps:
      - name: Post final status comment and close issue on success
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          succeeded="false"
          if [[ "$BUILD_RESULT" == "success" && ( "$RELEASE_RESULT" == "success" || "$RELEASE_RESULT" == "skipped" ) ]]; then
            succeeded="true"
          fi
          {
            printf 'Prebuilt build finished: **build=%s**' "$BUILD_RESULT"
            if [[ "$RELEASE_RESULT" != "skipped" ]]; then
              printf ', **release=%s**' "$RELEASE_RESULT"
            fi
            printf '\n\n- Workflow run & artifacts: %s\n' "$run_url"
            if [[ "$RELEASE_RESULT" == "success" && -n "$RELEASE_URLS" ]]; then
              IFS=, read -ra urls <<<"$RELEASE_URLS"
              for u in "${urls[@]}"; do
                printf -- '- Release: %s\n' "$u"
              done
            fi
            if [[ "$succeeded" == "true" && "$IS_PULL_REQUEST" != "true" ]]; then
              printf '\nClosing this issue automatically as completed.\n'
            fi
          } | gh issue comment "$ISSUE_NUMBER" --body-file -
          if [[ "$succeeded" == "true" && "$IS_PULL_REQUEST" != "true" ]]; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

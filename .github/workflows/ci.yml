name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate lockfile, scripts, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate config/versions.json
        run: python3 scripts/lock.py check

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check shell scripts with shellcheck
        run: shellcheck scripts/*.sh device/hosttools/aprotoc.sh
